    "imageio-ffmpeg>=0.6,<0.7",
    "langchain-core>=1.2,<2",
    "langfuse>=4.15,<5",
    "langgraph>=1.0,<2",
    "moviepy>=2.2,<3",
    "pillow>=11,<12",
    "pydantic>=2.12,<3",
    "pydub>=0.25.1,<0.26",
    "python-dotenv>=1.2,<2",
    "python-multipart>=0.0.22,<0.1",
    "streamlit>=1.54,<2",
    "uvicorn>=0.41,<1",
